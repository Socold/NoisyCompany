# Decoy personas: plausible, harmless, stable interests.
# Each persona has:
#   seeds   : entry pages for browsing sessions
#   domains : hosts it may follow links on and resolve in DNS sessions
#   queries : terms used for on-site searches (Wikipedia search, never ad-funded engines)
# Contributions welcome. Rules: no sensitive category (health, sexuality, religion,
# politics, crime, finance hardship), no login-only site, lightweight pages preferred.

[gardening]
seeds = ["https://en.wikipedia.org/wiki/Gardening", "https://en.wikipedia.org/wiki/Permaculture",
         "https://en.wikipedia.org/wiki/Companion_planting"]
domains = ["en.wikipedia.org", "www.rhs.org.uk", "extension.umn.edu", "www.gardenersworld.com"]
queries = ["tomato pruning", "compost ratio", "raised bed soil", "heirloom seeds", "mulching"]

