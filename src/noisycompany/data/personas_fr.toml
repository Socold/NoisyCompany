# French locale pack (feature `locale_packs`). Same rules as personas.toml:
# harmless interests only, text-light pages, sites that allow crawling.

[jardinage]
seeds = ["https://fr.wikipedia.org/wiki/Jardinage", "https://fr.wikipedia.org/wiki/Potager",
         "https://fr.wikipedia.org/wiki/Permaculture"]
domains = ["fr.wikipedia.org", "www.rustica.fr", "www.jardiner-malin.fr"]
queries = ["taille des tomates", "paillage", "compost", "semis de printemps", "purin d'ortie"]

[randonnee]
