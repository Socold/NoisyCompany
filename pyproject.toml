[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "noisycompany"
version = "2.2.0"
description = "Lightweight, bandwidth-aware network noise generator with coherent decoy personas"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "noisycompany contributors" }]
keywords = ["privacy", "obfuscation", "noise", "tracking", "dns", "profiling"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Security",
]
# Deliberately zero runtime dependencies: small attack surface, easy audit,
# runs on a Raspberry Pi Zero.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
noisycompany = "noisycompany.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
noisycompany = ["data/*.toml", "data/packs/*.toml", "data/business/*.toml", "data/scenarios/*.toml", "data/*.html", "data/*.css", "data/*.js"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S311"]  # random is fine: we generate noise, not secrets

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
