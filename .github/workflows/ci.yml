name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q
      - run: noisycompany estimate
      - run: noisycompany companion export --check
      - name: validate persona packs
        run: noisycompany packs check src/noisycompany/data/packs/*.toml && noisycompany packs check src/noisycompany/data/personas*.toml --no-meta

  companion:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Mozilla add-on linter
        run: npx --yes web-ext@8.3.0 lint --source-dir build/firefox --self-hosted
      - name: Chromium manifest sanity
        run: node -e 'const m=require("./build/chromium/manifest.json"); if(m.background.service_worker!=="sw.js"||m.permissions.includes("cookies")) process.exit(1)'


  appliances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Parse the Home Assistant AppArmor profile (draft)
        run: |
          command -v apparmor_parser || sudo apt-get install -y apparmor
          apparmor_parser -Q -K -d deploy/homeassistant/apparmor/apparmor.txt > /dev/null
      - name: Build the OpenWrt packages with the official SDK (24.10, ipk)
        run: |
          mkdir -p out && chmod 777 out
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/out:/out" \
            openwrt/sdk:x86-64-v24.10.8 sh /src/deploy/openwrt/ci-build.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openwrt-packages
          path: out/*
