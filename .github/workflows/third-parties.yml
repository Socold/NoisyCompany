# Monthly snapshot of the hosts a real browser contacts on each persona page
# (data/third_parties.json). The result is an artifact plus a summary: a maintainer
# reviews it and commits it in a pull request. The token stays read-only.
name: third-parties
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Snapshot
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
          python tools/third_party_snapshot.py third_parties.json
      - name: Summary
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          new = json.load(open("third_parties.json"))["sites"]
          old = json.load(open("src/noisycompany/data/third_parties.json"))["sites"]
          print(f"| | sites | hosts |\n|---|---|---|")
          print(f"| shipped | {len(old)} | {sum(map(len, old.values()))} |")
          print(f"| new | {len(new)} | {sum(map(len, new.values()))} |")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third_parties
          path: third_parties.json
