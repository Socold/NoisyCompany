# Umbrel community app store layout (no web UI exposed: the dashboard is localhost only).
services:
  # The image runs as uid 10001: give it the state directory the platform creates as root.
  state-owner:
    image: ghcr.io/socold/noisycompany:v2.0.1
    user: "0:0"
    entrypoint: ["chown", "10001:10001", "/state"]
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    restart: "no"
    volumes:
      - ${APP_DATA_DIR}/state:/state
  noisycompany:
    image: ghcr.io/socold/noisycompany:v2.0.1
    depends_on:
      state-owner: { condition: service_completed_successfully }
    network_mode: host
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 96m
    restart: on-failure
    command: ["run", "-p", "eco"]
    volumes:
      - ${APP_DATA_DIR}/state:/state
